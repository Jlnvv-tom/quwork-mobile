<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
  }
  #aliyun-captcha-element {
    width: 0;
    height: 0;
  }
  /* 阿里云 popup 模式以这个隐藏按钮为触发入口，程序化点击等价于用户点按。 */
  #aliyun-captcha-button {
    position: absolute;
    left: -9999px;
    top: -9999px;
    width: 1px;
    height: 1px;
  }
</style>
</head>
<body>
<div id="aliyun-captcha-element" aria-hidden="true"></div>
<button id="aliyun-captcha-button" type="button" tabindex="-1" aria-hidden="true"></button>
<script>
  // 阿里云验证码 2.0（滑块）承载页。
  // 与 Qurvis 桌面端使用同一份 Web SDK 与同一套 scene：脚本由本页加载，
  // 校验结果 captchaVerifyParam 通过 JavaScriptChannel 回传给 Flutter。
  (function () {
    var pendingConfig = null;

    function post(payload) {
      try {
        window.AliyunCaptchaBridge.postMessage(JSON.stringify(payload));
      } catch (error) {
        // 通道未注入时（例如在桌面浏览器里直接打开本页调试）静默忽略。
      }
    }

    function init(config) {
      window.initAliyunCaptcha({
        SceneId: config.sceneId,
        mode: 'popup',
        element: '#aliyun-captcha-element',
        button: '#aliyun-captcha-button',
        language: config.language || 'cn',
        success: function (value) {
          post({ type: 'success', value: value });
        },
        // 用户主动关闭弹窗：静默结束，由用户再次点击「获取验证码」重试。
        fail: function () {
          post({ type: 'fail' });
        },
        onError: function () {
          post({ type: 'error', detail: 'sdk-error' });
        },
        getInstance: function () {
          post({ type: 'ready' });
        }
      });
    }

    // 必须先写全局 region/prefix 再让脚本执行：SDK 在加载阶段读取这两个值。
    window.startCaptcha = function (config) {
      pendingConfig = config;
      window.AliyunCaptchaConfig = { region: config.region, prefix: config.prefix };
      if (typeof window.initAliyunCaptcha === 'function') {
        init(config);
        return;
      }
      var script = document.createElement('script');
      script.src = 'aliyun_captcha_sdk.js';
      script.async = true;
      script.onload = function () {
        init(pendingConfig);
      };
      script.onerror = function () {
        post({ type: 'error', detail: 'sdk-load-failed' });
      };
      document.head.appendChild(script);
    };

    window.triggerCaptcha = function () {
      var button = document.getElementById('aliyun-captcha-button');
      if (!button) {
        post({ type: 'error', detail: 'trigger-missing' });
        return;
      }
      post({ type: 'triggered' });
      button.click();
    };
  })();
</script>
</body>
</html>
